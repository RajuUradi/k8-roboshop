apiVersion: apps/v1
kind: Deployment

metadata:
 name: mongodb
 namespace: roboshop
 labels:  # deployment labels : Labels describing the Deployment itself
  name: mongodb
  project: roboshop
  env: dev
  tier: db

spec:
 replicas: 3
 selector:
  matchLabels: # selecor labels : Identifies which Pods belong to the Deployment/ReplicaSet
   name: mongodb
   env: dev
   tier: db
   project: roboshop

 template:
  metadata:
   labels:  # template labels: Labels that will be placed on newly created Pods
    name: mongodb
    env: dev
    tier: db
    project: roboshop

  spec:
   containers:
    - name: mongodb
      image: rajuuradi/mongodb:1.0.0

---
 apiVersion: v1
 kind: Service

 metadata:
  name: mongodb
  namespace: roboshop
  labels:
   name: mongodb
   env: dev
   tier: db
   project: roboshop
   
 spec:
  selector:
    # labels are used as selectors , this service is connected to all pods having  these resources
    name: mongodb
    env: dev
    tier: db
    project: roboshop

  ports:
  - protocol: TCP
    port: 27017 # servie port
    targetPort: 27017 # container port
