apiVersion: apps/v1
kind: Deployment
metadata:
 name: catalogue
 namespace: roboshop
 labels:
  name: catalogue
  env: dev
  project: roboshop
  tier: backend

spec:
 repliacs: 3
 selector:
  matchLabels: 
    name: catalogue
    env: dev
    project: roboshop
    tier: backend

 template:
  metadata:
   name: catalogue
   labels:
    name: catalogue
    env: dev
    project: roboshop
    tier: backend

  spec:
   containers:
   - name: catalogue 
     image: rajuuradi/catalogue:1.0.0

---

apiVersion: v1
kind: Service

metadata:
 name: catalogue
 namespace: roboshop
 labels:
    name: catalogue
    env: dev
    project: roboshop
    tier: backend

 spec:
  selector:
     name: catalogue
     env: dev
     project: roboshop
     tier: backend     

  ports:
   - protocol: TCP
     port: 8080
     targetPort: 8080

    




